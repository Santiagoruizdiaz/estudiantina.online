# CI de estudiantina.online: sintaxis/lint (Node + PHP), pruebas de integración y auditoría de dependencias.
# Para bloquear merges, exigir el check "CI result" en la protección de la rama main.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (Node + PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        # 8.1 es la versión mínima declarada para Hostinger (ADR-001); 8.3 la actual
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: none
      - name: Sintaxis JSON/JS/MJS, php -l y archivos sensibles
        run: npm run lint
        env:
          REQUIRE_PHP: "1"

  test:
    name: Tests (Node + PHP ${{ matrix.php }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        php: ["8.1", "8.3"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          extensions: mbstring, pdo_sqlite
          coverage: none
          tools: none
      - name: Instalar dependencias desde el lockfile
        run: npm ci --ignore-scripts
      - name: Pruebas unitarias y de integración (Node y PHP)
        run: npm test
        env:
          REQUIRE_PHP: "1"

  audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: npm audit (falla con severidad alta o crítica)
        run: npm audit --audit-level=high

  ci-result:
    name: CI result
    if: always()
    needs: [lint, test, audit]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Fallar si algún job no terminó en verde
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') || contains(needs.*.result, 'skipped')
        run: |
          echo "Resultados: lint=${{ needs.lint.result }} test=${{ needs.test.result }} audit=${{ needs.audit.result }}"
          exit 1
      - name: Todos los checks pasaron
        run: echo "lint, test y audit en verde"
